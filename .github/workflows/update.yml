name: Copy tvbox source to textdb
on:
  workflow_dispatch:   # 支持手动点按钮立即跑
  schedule:
    - cron: "0 0 * * *" # UTC时间，每天0点执行（对应国内早8点）

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch original source content
        run: |
          curl -L "shturl.cc/ECXIIZdIcnJE38Howbm" -o source_raw.json

      - name: Upload to textdb (simulate browser manual paste)
        env:
          TEXTDB_KEY: ${{ secrets.TEXTDB_KEY }}
        run: |
          curl -X POST 'https://textdb.online/update/' \
            -F "key=${TEXTDB_KEY}" \
            -F "value=@source_raw.json"
