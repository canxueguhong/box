name: Sync TVBox Config to textdb
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch upstream json & replace mirror link
        run: |
          curl -L "https://tvbox.xiaoy93.ccwu.cc" -o tvbox.json
          sed -i 's|https://raw.githubusercontent.com|https://ghfast.top/https://raw.githubusercontent.com|g' tvbox.json

      - name: Install jq
        run: sudo apt install jq -y

      - name: Upload to textdb.online
        run: |
          JSON_CONTENT=$(jq -R . tvbox.json)
          curl -X POST "https://textdb.online/api" \
            -H "Content-Type: application/json" \
            -d '{
              "key": "${{ secrets.TEXTDB_KEY }}",
              "data": ${JSON_CONTENT}
            }'