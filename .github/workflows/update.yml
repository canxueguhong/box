name: Sync TVBox Config to textdb
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Sync Config
        run: curl -L "https://tvbox.xiaoy93.ccwu.cc" -o tvbox.json; sed -i 's|https://raw.githubusercontent.com|https://ghfast.top/https://raw.githubusercontent.com|g' tvbox.json; B64=$(base64 -w 0 tvbox.json); curl -X POST https://textdb.online/api -H "Content-Type:application/json" -d "{\"key\":\"${{secrets.TEXTDB_KEY}}\",\"data\":\"$B64\",\"encode\":\"base64\"}"
