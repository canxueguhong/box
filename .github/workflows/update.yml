name: Sync & Replace TVBox Config
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch upstream config
        run: |
          curl -L "https://tvbox.xiaoy93.ccwu.cc" -o config.json

      - name: Replace raw links with ghproxy mirror
        run: |
          sed -i 's|https://raw.githubusercontent.com|https://ghfast.top/https://raw.githubusercontent.com|g' config.json

      - name: Setup Git & Push to Gitee
        run: |
          git config --global user.name "AutoSyncBot"
          git config --global user.email "bot@example.com"
          git remote add gitee https://${{ secrets.GITEE_TOKEN }}@gitee.com/canxue90/tvbox-sync.git
          git add config.json
          git commit -m "Auto update tvbox config $(date)" || true
          git push gitee HEAD:master --force
