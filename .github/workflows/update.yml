name: Copy tvbox source to textdb
on:
  workflow_dispatch:   # 手动运行
  schedule:
    - cron: "0 0 * * *" # UTC每天0点，北京时间早上8点

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch original source content
        run: |
          curl -L "https://tvbox.xiaoy93.ccwu.cc/" -o source_raw.json

      - name: Upload to textdb (simulate browser manual paste)
        env:
          TEXTDB_KEY: ${{ secrets.TEXTDB_KEY }}
        run: |
          res=$(curl -L -X POST 'https://textdb.online/update/' \
            -F "key=${TEXTDB_KEY}" \
            -F "value=@source_raw.json")
          echo "textdb响应: $res"
