name: Copy tvbox source to textdb
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch original source json
        run: |
          curl -L "https://tvbox.xiaoy93.ccwu.cc/" -o source_raw.json

      - name: Upload to TextDB
        env:
          TEXTDB_KEY: ${{ secrets.TEXTDB_KEY }}
        run: |
          res=$(curl -L -X POST "https://api.textdb.online/update/" \
            --data-urlencode "key=${TEXTDB_KEY}" \
            --data-urlencode "value@source_raw.json")
          echo "textdb响应: $res"
          echo "访问地址：https://textdb.online/${TEXTDB_KEY}"