name: Copy tvbox source to textdb
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch original source json
        run: |
          curl -L "shturl.cc/1Ua3BfZgNNiB0e7Zkql8" -o source_raw.json

      - name: Debug print key
        env:
          TEXTDB_KEY: ${{ secrets.TEXTDB_KEY }}
        run: |
          echo "Key value: |$TEXTDB_KEY|"

      - name: Upload to TextDB
        env:
          TEXTDB_KEY: ${{ secrets.TEXTDB_KEY }}
        run: |
          res=$(curl -L -X POST 'https://textdb.online/update/' \
            -F "key=${TEXTDB_KEY}" \
            -F "data=@source_raw.json")
          echo "textdb响应: $res"