name: Sync & Replace TVBox Config
on:
  workflow_dispatch: # 支持手动点按钮运行测试
  schedule:
    - cron: "0 */6 * * *" # 每6小时自动执行，UTC时间（国内=UTC+8）

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch upstream config
        run: |
          curl -L "https://tvbox.xiaoy93.ccwu.cc" -o config.json

      - name: Replace raw links with ghproxy mirror
        run: |
          sed -i 's|https://raw.githubusercontent.com|https://mirror.ghproxy.com/https://raw.githubusercontent.com|g' config.json

      - name: Setup Gitee Git
        run: |
          git config --global user.name "AutoSyncBot"
          git config --global user.email "bot@example.com"

      - name: Push to Gitee
        uses: ad-m/github-push-action@master
        with:
          repository: 你的Gitee用户名/你的仓库名
          branch: master
          directory: ./
          github_token: ${{ secrets.GITEE_TOKEN }}
          git_command: |
            git remote add gitee https://${{ secrets.GITEE_TOKEN }}@gitee.com/你的Gitee用户名/你的仓库名.git
            git add config.json
            git commit -m "Auto update tvbox config $(date)" || true
            git push gitee master --force
